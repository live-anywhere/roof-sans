[project]
name = "roofsans"
version = "1.3.0"
description = "Reproducible build of the Roof Sans variable font"
# The build code. The font it builds is under the SIL OFL 1.1 (OFL.txt).
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "fonttools==4.60.2",
    "skia-python==144.1",
    "uharfbuzz==0.57.0",
    "opentype-sanitizer==9.2.0",
    "pytest==9.2.0",
    "brotli==1.2.1",
]

[project.scripts]
roofsans-fetch = "roofsans.inputs:main"
roofsans-build = "roofsans.build:main"
roofsans-web = "roofsans.web:main"

[build-system]
requires = ["uv_build==0.11.27"]
build-backend = "uv_build"
