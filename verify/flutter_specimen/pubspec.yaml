name: flutter_specimen
description: "Roof Sans rendering check on Android (design Acceptance 10)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Staged by tool/stage_fonts.sh; assets/fonts/ is git-ignored.
  fonts:
    - family: RoofSans
      fonts:
        - asset: assets/fonts/RoofSansVariable.ttf
    - family: PretendardJP
      fonts:
        - asset: assets/fonts/PretendardJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/PretendardJP-Bold.ttf
          weight: 700
